name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # a stuck runner must not burn the default 360-minute limit; the suite
    # finishes in well under 20 minutes even on the 2-core runner
    timeout-minutes: 30
    strategy:
      matrix:
        # oldest supported (matches go.mod) plus the current stable release
        go: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1
