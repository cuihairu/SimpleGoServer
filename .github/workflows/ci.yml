name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # a stuck runner must not burn the default 360-minute limit; the suite
    # finishes in well under 20 minutes even on the 2-core runner
    timeout-minutes: 30
    strategy:
      matrix:
        # oldest supported (matches go.mod) plus the current stable release
        go: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gosec runs on the newest toolchain only: pinned to a tag that is
      # known to parse that toolchain's export data (older checkers fail
      # with "export data version" errors), and the zero-warning baseline
      # (documented #nosec justifications included) is enforced from here on.
      - name: Lint (gosec)
        if: matrix.go == 'stable'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -quiet ./...

      - name: Test
        run: go test ./... -race -count=1

      # Timing-sensitive suites fail with a different distribution than
      # correctness bugs: one flip under scheduler contention, then green
      # for many consecutive runs. The reactor package (accept loops,
      # drain timeouts, idle reapers) is where both of this repo's real
      # flakes lived: 182568f made the first one deterministic, and the
      # second — a shutdown registration race — was reproduced via
      # -cpu=1 -count=N and fixed by the registry gate. Repeating just
      # that package gives the next latent timing bug five chances per
      # push to surface here instead of in someone's local run (the
      # practice is written up in docs/NOTES.md §17). Stable toolchain
      # only: the repeat measures flake density, not toolchain
      # compatibility.
      - name: Flake tracking (reactor x5)
        if: matrix.go == 'stable'
        run: go test ./pkg/reactor/ -race -count=5

      # The README promises 100% statement coverage per package. Without a
      # gate that promise decays silently: delete a test or add an error
      # branch and the suite above stays green. This runs the suite a second
      # time to build a profile and fails if any package drops below the
      # floor, so the claim is checked rather than asserted.
      #
      # Stable toolchain only, for the same reason as gosec above. The gate
      # re-runs the tests, so it also costs a full suite pass -- acceptable
      # because it only runs on one leg of the matrix.
      - name: Coverage gate
        if: matrix.go == 'stable'
        run: ./scripts/check-coverage.sh --threshold 100

      # The fuzz targets are the only thing here that hunts for input no
      # human thought of, and the step above proves just the easy half: plain
      # `go test` replays the seed corpus, it does not mutate. This gives each
      # discovered target a fixed wall-clock budget; a crash fails the build
      # and `go test` drops the offending input into testdata/fuzz/<Target>/,
      # so committing that file turns the find into a permanent regression
      # case.
      #
      # Targets are discovered from the source, not listed here, so a new
      # Fuzz function is gated the moment it lands; a repo with no targets at
      # all fails loudly rather than reporting "0 crashes". No -race by design
      # (the detector cuts mutation throughput ~10x for the same budget; the
      # Test step above already owns race detection). Stable toolchain only,
      # for the same reason as the other gates.
      - name: Fuzz smoke (20s per target)
        if: matrix.go == 'stable'
        run: ./scripts/fuzz-smoke.sh
